[project]
name = "autoyard"
version = "0.1.0"
description = "AutoYard Copilot - 자연어 지시를 검증된 야드 배치로 바꾸는 에이전트"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.3",
    "pydantic>=2.7",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "plotly>=5.22",
    "streamlit>=1.36",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
